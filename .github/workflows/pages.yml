name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/sharedvd.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          # site/ 配下は robots.txt・sitemap.xml・検索エンジンの所有権確認ファイルを含めてすべて配信する
          cp site/* _site/
          cp assets/sharedvd.png _site/icon.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
